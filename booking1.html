<style>
     * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
     body {
    font-family: Verdana, sans-serif;
    background-image: url('bg.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #30251d;
}

header {
    background-color: rgb(172, 105, 63);
    padding: 20px 30px;
    border: 3px outset black;
    border-radius: 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: Georgia, serif;
}
 
.menu-dropdown {
    position: relative;
    margin-left: auto;
}


.menu-icon {
    font-size: 30px;
    color: #302d2d;
    background: transparent;
    border: none;
    padding: 8px 15px;
    cursor: pointer;
    border-radius: 15px;
    transition: 0.3s;
}

.menu-icon:hover {
    background-color: #f0c49a;
}


.menu-content {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    min-width: 200px;
    background-color: rgb(172, 105, 63);
    border: 2px solid #080808;
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    overflow: hidden;
}


.menu-dropdown:hover .menu-content,
.menu-dropdown:focus-within .menu-content {
    display: block;
}

.menu-content a {
    display: block;
    padding: 15px 20px;
    color: #302d2d;
    text-decoration: none;
    font-size: 17px;
    transition: 0.3s;
}

.menu-content a:hover {
    background-color: #f0c49a;
    padding-left: 28px;
}
    .heading {
    text-align: center;
    padding: 20px 15px 25px;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
}
.long-box {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    width:1300px;
    min-height: 300px;
    padding: 10px;
    background-color: burlywood;
    border: 2px solid #4b3025;
    border-radius: 25px;
    margin-left: 30px;
    margin-top: 20px;
}
.image-box{
  
    padding: 15px;
    border: 2px solid burlywood;;
    border-radius: 15px;
    width:300px;
    height: 300px;
   
}
.image-box img {
    width: 270px;
    height: 270px;
    object-fit: cover;
    border: 2px solid #4b3025;
    border-radius: 20px;
    align-items: center;
}



.content-box {
    flex: 1;
    height: 290px;
    padding: 15px;
    border: 2px solid #4b3025;
    border-radius: 15px;
   width: 200px;
   
    
}
.book-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 12px 30px;
    background-color: rgb(172, 105, 63);
    color: white;
    border: 2px solid rgb(0, 0, 0);
    border-radius: 25px;
    font-size: 18px;
    cursor: pointer;
    z-index: 2;
}

.book-btn:hover {
    background-color: #f0c49a;
    color: #30251d;
}
</style>
<body>

</div>

<div class="long-box">
