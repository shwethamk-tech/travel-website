<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
     body {
    font-family: Verdana, sans-serif;
    background-image: url('images/bg.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #30251d;
}

header {
    background-color: rgb(172, 105, 63);
    padding: 20px 30px;
    border: 3px outset black;
    border-radius: 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: Georgia, serif;
}
 
.menu-dropdown {
    position: relative;
    margin-left: auto;
}


.menu-icon {
    font-size: 30px;
    color: #302d2d;
    background: transparent;
    border: none;
    padding: 8px 15px;
    cursor: pointer;
    border-radius: 15px;
    transition: 0.3s;
}

.menu-icon:hover {
    background-color: #f0c49a;
}


.menu-content {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    min-width: 200px;
    background-color: rgb(172, 105, 63);
    border: 2px solid #080808;
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    overflow: hidden;
}


.menu-dropdown:hover .menu-content,
.menu-dropdown:focus-within .menu-content {
    display: block;
}

.menu-content a {
    display: block;
    padding: 15px 20px;
    color: #302d2d;
    text-decoration: none;
    font-size: 17px;
    transition: 0.3s;
}

.menu-content a:hover {
    background-color: #f0c49a;
    padding-left: 28px;
}
    .heading {
    text-align: center;
    padding: 20px 15px 25px;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
}

.heading h1 {
    font-family: Georgia, serif;
    font-size: 36px;
    margin-bottom: 15px;
}

.heading p {
    font-size: 16px;
    line-height: 1.6;
}
  
    .video-box {
    width: 80%;
    max-width: 900px;
    height: 400px;
    margin: 20px auto 40px;
    position: relative;
    overflow: hidden;
    border: 3px solid black;
    border-radius: 30px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
    background-color: rgba(146, 114, 77, 0.5);
}

.box-video {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    object-fit: cover;
}
.book-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 12px 30px;
    background-color: rgb(172, 105, 63);
    color: white;
    border: 2px solid rgb(0, 0, 0);
    border-radius: 25px;
    font-size: 18px;
    cursor: pointer;
    z-index: 2;
}

.book-btn:hover {
    background-color: #f0c49a;
    color: #30251d;
}
       
</style>
<body>
     <header>
        <h2>✈ Wanderlust</h2>
        
        
        <div class="menu-dropdown">
    <button class="menu-icon">☰</button>

    <div class="menu-content">
        <a href="rough.html"> 🏡 Home</a>
        <a href="destination.html">🌍 Destinations</a>
        <a href="gallery.html">🌄 gallery</a>
          <a href="booking.html">📋bookings</a>
        <a href="contact.html">☎️Contact</a>
    </div>
</div>
    </header>
     <div class="heading">
        <h1>Explore & Book🌍</h1>
        <p>"Your trusted partner for every adventure🖤"</p>
    </div>
    <div class="video-box">
    <video autoplay muted loop playsinline class="box-video">
        <source src="images/travel.mp4" type="video/mp4">
    </video>
    
    <div class="book-btn">
    <a href="booking1.html"> Book Now ✈</a>
    </div>
     
</div>>
</body>
</html>
