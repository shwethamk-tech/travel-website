<style>
      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
     body {
    font-family: Verdana, sans-serif;
    background-image: url('bg.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #30251d;
}
header {
    background-color: rgb(172, 105, 63);
    padding: 20px 30px;
    border: 3px outset black;
    border-radius: 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: Georgia, serif;
}
 
.menu-dropdown {
    position: relative;
    margin-left: auto;
}


.menu-icon {
    font-size: 30px;
    color: #302d2d;
    background: transparent;
    border: none;
    padding: 8px 15px;
    cursor: pointer;
    border-radius: 15px;
    transition: 0.3s;
}

.menu-icon:hover {
    background-color: #f0c49a;
}


.menu-content {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    min-width: 200px;
    background-color: rgb(172, 105, 63);
    border: 2px solid #080808;
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    overflow: hidden;
}


.menu-dropdown:hover .menu-content,
.menu-dropdown:focus-within .menu-content {
    display: block;
}

.menu-content a {
    display: block;
    padding: 15px 20px;
    color: #302d2d;
    text-decoration: none;
    font-size: 17px;
    transition: 0.3s;
}

.menu-content a:hover {
    background-color: #f0c49a;
    padding-left: 28px;
}
  .long-box {
    display: flex;
    align-items: flex-start;
   
    width:700px;
    min-height: 700px;
    padding: 20px;
    background-color: rgb(240, 220, 194);
    border: 6px solid #4b3025;
    border-radius: 25px;
    margin-left: 330px;
    margin-top: 20px;
    flex-direction: column;
}
.long-box h1{

}

   margin-left: 30px;

}
input {

    font-size: 16px;
    margin-left: 30px;
    margin-top: 10px;
}

</style>
