
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
</head>
<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    background-image: url("images/bg.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    color: white;
    padding-bottom: 20px;
}

header {
    background-color: rgb(172, 105, 63);
    padding: 20px 30px;
    border: 3px outset black;
    border-radius: 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

header h2 {
    font-family: Georgia, serif;
}
.menu-dropdown {
    position: relative;
    margin-left: auto;
}


.menu-icon {
    font-size: 30px;
    color: #302d2d;
    background: transparent;
    border: none;
    padding: 8px 15px;
    cursor: pointer;
    border-radius: 15px;
    transition: 0.3s;
}

.menu-icon:hover {
    background-color: #f0c49a;
}


.menu-content {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    min-width: 200px;
    background-color: rgb(172, 105, 63);
    border: 2px solid #080808;
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    overflow: hidden;
}


.menu-dropdown:hover .menu-content,
.menu-dropdown:focus-within .menu-content {
    display: block;
}

.menu-content a {
    display: block;
    padding: 15px 20px;
    color: #302d2d;
    text-decoration: none;
    font-size: 17px;
    transition: 0.3s;
}

.menu-content a:hover {
    background-color: #f0c49a;
    padding-left: 28px;
}
nav a {
    color: white;
    text-decoration: none;
    margin: 10px;
    font-size: 17px;
}

nav a:hover {
    color: #ffe0b2;
    text-decoration: underline;
}

.contact-box {
    width: 90%;
    max-width: 550px;
    margin: 40px auto;
    padding: 30px;
    background: rgba(60, 35, 20, 0.88);
    border: 2px solid #d69a6a;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
}

.contact-box h2 {
    text-align: center;
    color: #ffd2a6;
    margin-bottom: 15px;
}

.contact-box > p {
    text-align: center;
    line-height: 1.6;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d69a6a;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    outline: none;
}

input:focus,
textarea:focus {
    border: 2px solid #e6a66c;
}

textarea {
    resize: vertical;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    background-color: rgb(172, 105, 63);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #c7834e;
    transform: scale(1.02);
}

.contact-info {
    text-align: center;
    margin-top: 25px;
    line-height: 2;
}

footer {
    text-align: center;
    padding: 15px;
    background-color: rgb(172, 105, 63);
}

</style>
<body>

    <header>
        <h1>✈Wanderlust</h1>
          <div class="menu-dropdown">
    <button class="menu-icon">☰</button>

    <div class="menu-content">
        <a href="rough.html"> 🏡 Home</a>
        <a href="destination.html">🌍 Destinations</a>
        <a href="gallery.html">🌄 gallery</a>
          <a href="booking.html">📋bookings</a>
        <a href="contact.html">☎️Contact</a>
    </div>
</div>
    </header>

    <div class="contact-box">
        <h2>Get In Touch 💌</h2>
        <p>Have questions about your next trip? We would love to hear from you!</p>

        <form action="#" method="get">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject"
                   placeholder="Enter the subject">

            <label for="message">Your Message</label>
            <textarea id="message" name="message"
                      placeholder="Write your message here..."
                      rows="5" required></textarea>

            <button type="submit">Send Message ✉️</button>
        </form>

        <div class="contact-info">
            <p>📧 Email: wanderlust@gmail.com</p>
            <p>🌍 Explore the world with us!</p>
        </div>
    </div>

    <footer>
        <p>© 2026 Travel Website | Explore • Discover • Enjoy</p>
    </footer>

</body>
</html>
